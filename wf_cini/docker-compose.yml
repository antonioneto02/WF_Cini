services:
  wf-cini:
    image: wf-cini:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wf-cini
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file:
      - .env
    environment:
      CERT_DIR: C:/certs
    volumes:
      # Pasta inteira (nao so o codigo copiado na imagem): restart via
      # supervisor pega o que estiver salvo no disco na hora, sem rebuild.
      - C:/Projetos/WF_Cini/wf_cini:C:/app
      - C:/Projetos/Certificados:C:/certs:ro
